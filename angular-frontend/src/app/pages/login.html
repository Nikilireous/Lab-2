<section class="auth-card panel">
  <p class="eyebrow">Учёт студентов</p>
  <h1>Вход</h1>
  <p class="muted">Войдите, чтобы просматривать записи общежития.</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >Имя пользователя или почта<input formControlName="username" autocomplete="username"
    /></label>
    <label
      >Пароль<input type="password" formControlName="password" autocomplete="current-password"
    /></label>
    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }
    <button class="button primary" type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Входим…' : 'Войти' }}
    </button>
  </form>
  <p class="muted">Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a></p>
</section>
