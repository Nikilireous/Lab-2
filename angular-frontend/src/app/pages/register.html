<section class="auth-card panel">
  <p class="eyebrow">Учёт студентов</p>
  <h1>Регистрация</h1>
  <p class="muted">
    Новая учётная запись может просматривать данные. Изменения доступны администратору.
  </p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label
      >Имя пользователя<input formControlName="username" autocomplete="username" minlength="3"
    /></label>
    <label
      >Электронная почта<input type="email" formControlName="email" autocomplete="email"
    /></label>
    <label
      >Пароль<input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        minlength="8"
    /></label>
    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }
    <button class="button primary" type="submit" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Создаём…' : 'Зарегистрироваться' }}
    </button>
  </form>
  <p class="muted">Уже есть аккаунт? <a routerLink="/login">Войти</a></p>
</section>
