<section class="page-head">
  <div>
    <p class="eyebrow">Общежитие</p>
    <h1>Студенты</h1>
    <p class="muted">Поиск и учёт заселения</p>
  </div>
  @if (auth.isAdmin()) {
    <a class="button primary" routerLink="/students/new">Добавить студента</a>
  }
</section>
<app-student-filters [form]="form" [sort]="sort()" [order]="order()"
  (resetRequested)="reset()" (sortChanged)="setSort($event)"
  (orderToggled)="toggleOrder()" />
<app-student-list [items]="items()" [total]="total()" [loading]="loading()"
  [error]="error()" [page]="page()" [pages]="pages()" [size]="size()"
  [deleting]="deleting()" [isAdmin]="auth.isAdmin()"
  (retryRequested)="reload()" (deleteRequested)="remove($event)"
  (pageChanged)="go($event)" (sizeChanged)="setSize($event)" />
