<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Студенты — список</title>
  <link rel="icon" href="favicon/index.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html?v=students-api-3" class="logo">СУ</a>
      <nav class="nav">
        <a href="index.html?v=students-api-3" class="nav-link active">Студенты</a>
        <a href="student-form.html?v=students-api-3" class="nav-link">Добавить</a>
      </nav>
    </div>
  </header>

  <main class="main" id="main-content">
    <div class="container">
      <!-- Уведомления -->
      <div id="notice" class="notice" hidden></div>

      <!-- Заголовок -->
      <div class="page-header">
        <h1>Список студентов</h1>
        <p class="page-subtitle">Данные загружаются с сервера</p>
      </div>

      <!-- Статистика -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-value" id="total-count">0</div>
          <div class="stat-label">Студентов в списке</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">◎</div>
          <div class="stat-value" id="foreign-count">0</div>
          <div class="stat-label">Иностранных</div>
        </div>
      </div>

      <!-- Панель управления -->
      <div class="controls">
        <a href="student-form.html?v=students-api-3" class="btn btn-primary">＋ Добавить студента</a>
      </div>

      <!-- Фильтры -->
      <div class="filters">
        <h3 class="filters-title">Фильтры</h3>
        <div class="filters-grid">
          <div class="filter-group">
            <label for="filter-group" class="filter-label">Группа</label>
            <input type="text" id="filter-group" class="filter-input" placeholder="Например, A1234">
          </div>
          <div class="filter-group">
            <label for="filter-dormitory" class="filter-label">Общежитие</label>
            <input type="number" id="filter-dormitory" class="filter-input" placeholder="1-20" min="1" max="20">
          </div>
          <div class="filter-group">
            <label for="filter-room" class="filter-label">Комната</label>
            <input type="number" id="filter-room" class="filter-input" placeholder="100-599" min="100" max="599">
          </div>
          <div class="filter-group">
            <label for="filter-isForeign" class="filter-label">Статус</label>
            <select id="filter-isForeign" class="filter-input">
              <option value="">Все</option>
              <option value="true">Иностранные</option>
              <option value="false">Граждане РФ</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="filter-dateFrom" class="filter-label">Дата заселения с</label>
            <input type="date" id="filter-dateFrom" class="filter-input">
          </div>
          <div class="filter-group">
            <label for="filter-dateTo" class="filter-label">Дата заселения по</label>
            <input type="date" id="filter-dateTo" class="filter-input">
          </div>
        </div>
        <div class="filters-actions">
          <button id="apply-filters" class="btn btn-primary">Применить фильтры</button>
          <button id="reset-filters" class="btn btn-secondary">Сбросить</button>
        </div>
      </div>

      <!-- Поиск -->
      <div class="search-box">
        <label for="search-input" class="search-label">🔍 Поиск по ФИО или ИСУ ID</label>
        <input type="text" id="search-input" class="search-input" placeholder="Введите ФИО или ИСУ ID...">
      </div>

      <!-- Таблица -->
      <div class="table-wrapper">
        <table class="students-table" id="students-table">
          <thead>
            <tr>
              <th>Студент</th>
              <th>Группа</th>
              <th>ИСУ ID</th>
              <th>Общежитие</th>
              <th>Комната</th>
              <th>Срок заселения</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="students-table-body">
            <!-- Строки добавляются через JS -->
          </tbody>
        </table>
      </div>

      <!-- Пустое состояние -->
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">📭</div>
        <h2 id="empty-title" class="empty-title">Список пуст</h2>
        <p id="empty-text" class="empty-text">Добавьте первого студента</p>
        <a href="student-form.html?v=students-api-3" class="btn btn-primary">Добавить студента</a>
      </div>

      <!-- Сводка результатов -->
      <div id="results-summary" class="results-summary"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Учёт общежития © 2026</p>
    </div>
  </footer>

  <script src="js/app.js?v=students-api-3"></script>
</body>
</html>
