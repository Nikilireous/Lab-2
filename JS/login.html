<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Учёт общежития</title>
  <link rel="stylesheet" href="css/style.css?v=lab3-2">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="header"><div class="header-container"><span class="logo">СУ</span></div></header>
  <main class="main">
    <div class="auth-card">
      <h1 id="auth-title">Вход</h1>
      <p id="auth-hint">Войдите, чтобы открыть список студентов.</p>
      <p id="auth-error" class="auth-error" hidden></p>
      <form id="auth-form">
        <label for="username">Имя пользователя или почта</label>
        <input id="username" name="username" required autocomplete="username">
        <div id="email-row" hidden>
          <label for="email">Электронная почта</label>
          <input id="email" name="email" type="email" autocomplete="email">
        </div>
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
        <button class="btn btn-primary" type="submit" id="auth-submit">Войти</button>
      </form>
      <button class="auth-switch" type="button" id="auth-switch">Создать учётную запись</button>
    </div>
  </main>
  <script src="js/login.js?v=lab3"></script>
</body>
</html>
