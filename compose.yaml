services:
  db:
    image: ${DB_IMAGE}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:${DB_DATA_PATH}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${BIND_ADDRESS}:${DB_HOST_PORT}:${DB_INTERNAL_PORT}"

  api:
    build: ${API_BUILD_CONTEXT}
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_MINUTES: ${ACCESS_MINUTES}
      REFRESH_DAYS: ${REFRESH_DAYS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TZ: ${APP_TIMEZONE}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${BIND_ADDRESS}:${API_PORT}:${API_INTERNAL_PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${API_HEALTH_URL} >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  frontend:
    build: ${FRONTEND_BUILD_CONTEXT}
    ports:
      - "${BIND_ADDRESS}:${FRONTEND_PORT}:${FRONTEND_INTERNAL_PORT}"
    depends_on:
      api:
        condition: service_healthy

  swagger:
    image: ${SWAGGER_IMAGE}
    environment:
      SWAGGER_JSON: ${SWAGGER_SPEC_TARGET}
    volumes:
      - ${SWAGGER_SPEC_SOURCE}:${SWAGGER_SPEC_TARGET}:ro
    ports:
      - "${BIND_ADDRESS}:${SWAGGER_PORT}:${SWAGGER_INTERNAL_PORT}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${DB_VOLUME_NAME}
