services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: students_lab3
      POSTGRES_USER: lab3
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab3 -d students_lab3"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./java-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/students_lab3
      DB_USER: lab3
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_MINUTES: ${ACCESS_MINUTES:-15}
      REFRESH_DAYS: ${REFRESH_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TZ: Europe/Moscow
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/openapi.yaml >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  frontend:
    build: ./JS
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"
    depends_on:
      api:
        condition: service_healthy

  swagger:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.21.0
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./java-backend/src/main/webapp/openapi.yaml:/openapi.yaml:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
